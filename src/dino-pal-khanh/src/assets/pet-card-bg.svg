<!--
  Tự vẽ lại (hidden-build-bg.png trên gstatic đã 404 vĩnh viễn) — quầng sáng
  mờ dùng bảng màu Google (xanh dương/xanh lá/vàng/đỏ) làm nền cho thẻ hiển
  thị thú, background-size: contain nên chỉ cần bố cục vuông đơn giản.
-->
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A73E8" stop-opacity="0.18" />
      <stop offset="35%" stop-color="#34A853" stop-opacity="0.10" />
      <stop offset="65%" stop-color="#FBBC04" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#glow)" />
</svg>
